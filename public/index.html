<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172539">
  <title>Anshel Virtual Tech</title>
  <link rel="manifest" href="/office.webmanifest">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/office.css">
  <script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="workspace" class="viewport" aria-label="Kantor 3D Anshel Virtual Tech" hidden>
    <div id="scene"></div>
    <div id="room-labels"></div>
    <div id="scene-message" role="status">Memuat kantor 3D…</div>

    <div class="brand hud">
      <img src="/favicon.svg" alt="" width="35" height="35">
      <strong>Anshel <span>Virtual Tech</span></strong>
    </div>
    <div class="status-hud hud">
      <span class="tag" id="phase"><i></i><span>Memuat status</span></span>
      <span class="clock"><strong id="clock">--:--</strong><small>WIB</small></span>
    </div>
    <div class="utilities hud" aria-label="Kontrol aplikasi">
      <button class="icon-button" id="light-toggle" aria-label="Tampilkan malam" title="Tampilkan malam" type="button" data-icon="moon"></button>
      <button class="icon-button" data-panel="settings" aria-label="Pengaturan" title="Pengaturan" type="button" data-icon="settings"></button>
      <button class="icon-button" data-camera="fullscreen" aria-label="Layar penuh" title="Layar penuh" type="button" data-icon="fullscreen"></button>
    </div>

    <div class="navigation-hud">
      <div class="camera hud" aria-label="Kontrol kamera">
        <button class="icon-button" data-camera="zoomIn" aria-label="Perbesar" title="Perbesar" type="button" data-icon="zoomIn"></button>
        <button class="icon-button" data-camera="zoomOut" aria-label="Perkecil" title="Perkecil" type="button" data-icon="zoomOut"></button>
        <button class="icon-button" data-camera="reset" aria-label="Lihat seluruh kantor" title="Lihat seluruh kantor" type="button" data-icon="reset"></button>
        <button class="icon-button" id="character-mode" aria-label="Main sebagai Dika" title="Main sebagai Dika" aria-pressed="false" type="button" data-icon="character" disabled></button>
      </div>
      <div class="worker-status hud"><i id="worker-light"></i><span id="worker-status">Memeriksa worker</span></div>
    </div>
    <div id="character-controls" class="hud" aria-label="Kontrol gerak Dika" hidden>
      <span>WASD atau tombol panah</span>
      <button data-move="up" aria-label="Maju" type="button">↑</button>
      <button data-move="left" aria-label="Kiri" type="button">←</button>
      <button data-move="down" aria-label="Mundur" type="button">↓</button>
      <button data-move="right" aria-label="Kanan" type="button">→</button>
    </div>

    <nav class="actions hud" aria-label="Panel kantor">
      <button class="nav-button" data-panel="office" type="button" data-icon="map"><span>Ruang</span></button>
      <button class="nav-button" data-panel="projects" type="button" data-icon="project"><span>Proyek</span></button>
      <button class="nav-button" data-panel="monitor" type="button" data-icon="activity"><span>Monitor</span></button>
      <button class="nav-button" data-panel="audit" type="button" data-icon="activity"><span>Aktivitas</span></button>
      <button class="nav-button" data-panel="tasks" type="button" data-icon="tasks"><span>Tugas</span><b id="queue-badge" hidden></b></button>
    </nav>
    <button class="primary floating-task" id="new-task" type="button" data-icon="zoomIn"><span>Tugas baru</span></button>

    <aside class="inspector hud" aria-label="Detail kantor" hidden>
      <div class="inspector-heading">
        <div><p id="panel-kicker"></p><h2 id="panel-title"></h2></div>
        <button id="inspector-back" class="icon-button" type="button" aria-label="Tutup panel" title="Tutup panel" data-icon="close"></button>
      </div>
      <div id="panel-content"></div>
    </aside>
  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-heading"><h2>Tugas baru</h2><button type="button" class="icon-button" data-close aria-label="Tutup">×</button></div>
      <label>Jenis pekerjaan<select name="kind"><option value="diagnostic">Diagnostik worker</option><option value="draft">Draf AI</option></select></label>
      <label>Divisi<select name="division" required></select></label>
      <label>Proyek <span>(opsional)</span><input name="project" maxlength="80" placeholder="Nama proyek"></label>
      <label>Instruksi<textarea name="description" required maxlength="2000" rows="3"></textarea></label>
      <label>Prioritas<select name="priority"><option value="0">Normal</option><option value="1">Tinggi</option><option value="2">Mendesak</option></select></label>
      <label class="checkbox"><input name="urgent" type="checkbox"> Boleh dijalankan di luar jam kerja</label>
      <p id="task-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Tambahkan ke antrean</button>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
  </main>

  <section id="auth" class="auth" aria-labelledby="auth-title" hidden>
    <form id="login-form">
      <p class="eyebrow">Kantor privat Dika</p>
      <h1 id="auth-title">Anshel<br>Virtual Tech<span>.</span></h1>
      <label for="password">Kata sandi pemilik</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Masuk ke kantor →</button>
    </form>
  </section>

</body>
</html>
