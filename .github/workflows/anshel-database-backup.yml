name: Anshel - Backup PostgreSQL Terenkripsi

on:
  workflow_dispatch:
  schedule:
    # 09:17 WIB; GitHub scheduler may be delayed.
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: anshel-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANSHEL_DATABASE_URL: ${{ secrets.ANSHEL_DATABASE_URL }}
      ANSHEL_BACKUP_AGE_RECIPIENT: ${{ vars.ANSHEL_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Validate backup settings
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${ANSHEL_DATABASE_URL}" || -z "${ANSHEL_BACKUP_AGE_RECIPIENT}" ]]; then
            echo "::error::Configure ANSHEL_DATABASE_URL secret and ANSHEL_BACKUP_AGE_RECIPIENT variable first."
            exit 1
          fi
          if [[ "${ANSHEL_DATABASE_URL}" != *'pooler.supabase.com:5432/'* ]]; then
            echo "::error::Use the Supabase Session pooler connection string on port 5432."
            exit 1
          fi
          if [[ "${ANSHEL_BACKUP_AGE_RECIPIENT}" != age1* ]]; then
            echo "::error::Provide a public age recipient (age1...), never the private key."
            exit 1
          fi

      - name: Install age encryption utility
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Create and encrypt database backup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          BACKUP_DIR="$(mktemp -d "${RUNNER_TEMP}/anshel-backup.XXXXXXXX")"
          echo "BACKUP_DIR=${BACKUP_DIR}" >> "${GITHUB_ENV}"
          trap 'rm -f "${BACKUP_DIR}/anshel.dump" "${BACKUP_DIR}/contents.txt"' EXIT

          # Data from application schema anshel only (not Auth / Storage objects).
          docker run --rm --network host \
            -e ANSHEL_DATABASE_URL -e PGSSLMODE=require \
            -v "${BACKUP_DIR}:/out" postgres:17-alpine \
            sh -ec 'pg_dump --dbname="$ANSHEL_DATABASE_URL" --format=custom --schema=anshel --no-owner --no-privileges --file=/out/anshel.dump'

          test "$(stat -c '%s' "${BACKUP_DIR}/anshel.dump")" -gt 512
          docker run --rm -v "${BACKUP_DIR}:/out:ro" postgres:17-alpine \
            pg_restore --list /out/anshel.dump > "${BACKUP_DIR}/contents.txt"
          grep -qi 'anshel' "${BACKUP_DIR}/contents.txt"

          FILE="anshel-$(date -u +'%Y%m%dT%H%M%SZ').dump.age"
          age -r "${ANSHEL_BACKUP_AGE_RECIPIENT}" -o "${BACKUP_DIR}/${FILE}" "${BACKUP_DIR}/anshel.dump"
          test "$(stat -c '%s' "${BACKUP_DIR}/${FILE}")" -gt 128
          ( cd "${BACKUP_DIR}" && sha256sum "${FILE}" > "${FILE}.sha256" )
          printf '{"format":"pg_dump custom+age","schema":"anshel","created_utc":"%s","encrypted_file":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${FILE}" > "${BACKUP_DIR}/backup-info.json"
          rm -f "${BACKUP_DIR}/anshel.dump" "${BACKUP_DIR}/contents.txt"

      - name: Upload only encrypted artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anshel-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_DIR }}/*.age
            ${{ env.BACKUP_DIR }}/*.sha256
            ${{ env.BACKUP_DIR }}/backup-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


      # Optional until the separate Cloudflare R2 bucket/credentials are configured.
      # Always upload GitHub artifact first, preserving the primary backup if R2 fails.
      - name: Upload encrypted backup to Cloudflare R2 and verify it
        if: ${{ vars.ANSHEL_BACKUP_R2_ENABLED == 'true' }}
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.ANSHEL_BACKUP_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.ANSHEL_BACKUP_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ANSHEL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ANSHEL_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -Eeuo pipefail
          umask 077
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${R2_ENDPOINT}" || -z "${R2_BUCKET}" ]]; then
            echo "::error::Cloudflare R2 enabled but credentials or endpoint/bucket are missing."
            exit 1
          fi
          if [[ ! "${R2_ENDPOINT}" =~ ^https://[a-zA-Z0-9.-]+\.r2\.cloudflarestorage\.com$ ]]; then
            echo "::error::R2 endpoint must be the HTTPS S3 endpoint from Cloudflare R2 Overview."
            exit 1
          fi
          if [[ ! "${R2_BUCKET}" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::R2 bucket name is invalid."
            exit 1
          fi
          command -v aws >/dev/null || { echo "::error::AWS CLI unavailable on runner."; exit 1; }
          shopt -s nullglob
          ENCRYPTED_FILES=("${BACKUP_DIR}"/anshel-*.dump.age)
          if (( ${#ENCRYPTED_FILES[@]} != 1 )); then
            echo "::error::Expected exactly one encrypted backup file."
            exit 1
          fi
          ENCRYPTED="${ENCRYPTED_FILES[0]}"
          FILENAME="${ENCRYPTED##*/}"
          YEAR="${FILENAME:7:4}"
          MONTH="${FILENAME:11:2}"
          OBJECT_PREFIX="anshel/postgres/${YEAR}/${MONTH}"
          OBJECT_URI="s3://${R2_BUCKET}/${OBJECT_PREFIX}/${FILENAME}"
          LOCAL_SHA="$(sha256sum "${ENCRYPTED}" | awk '{print $1}')"
          VERIFY_FILE="${BACKUP_DIR}/r2-copy-verify.age"
          trap 'rm -f "${VERIFY_FILE}"' EXIT

          # The bucket is private; encryption happens BEFORE upload.
          aws --endpoint-url "${R2_ENDPOINT}" s3 cp "${ENCRYPTED}" "${OBJECT_URI}" --no-progress --only-show-errors
          # Download the actual remote bytes; verify integrity independently.
          aws --endpoint-url "${R2_ENDPOINT}" s3 cp "${OBJECT_URI}" "${VERIFY_FILE}" --no-progress --only-show-errors
          REMOTE_SHA="$(sha256sum "${VERIFY_FILE}" | awk '{print $1}')"
          if [[ "${LOCAL_SHA}" != "${REMOTE_SHA}" ]]; then
            echo "::error::Cloudflare R2 copy checksum mismatch. Offsite backup NOT verified."
            exit 1
          fi
          rm -f "${VERIFY_FILE}"

          aws --endpoint-url "${R2_ENDPOINT}" s3 cp "${ENCRYPTED}.sha256" "${OBJECT_URI}.sha256" --no-progress --only-show-errors
          aws --endpoint-url "${R2_ENDPOINT}" s3 cp "${BACKUP_DIR}/backup-info.json" "s3://${R2_BUCKET}/${OBJECT_PREFIX}/${FILENAME}.info.json" --no-progress --only-show-errors
          echo "### Offsite backup: Cloudflare R2 verified" >> "${GITHUB_STEP_SUMMARY}"
          echo "Encrypted bytes uploaded, downloaded and SHA-256 verified. Bucket: ${R2_BUCKET}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report offsite storage not yet enabled
        if: ${{ vars.ANSHEL_BACKUP_R2_ENABLED != 'true' }}
        shell: bash
        run: |
          echo "### Offsite backup: not enabled" >> "${GITHUB_STEP_SUMMARY}"
          echo "GitHub artifact was created; configure Cloudflare R2 before claiming a second copy." >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete temporary files
        if: always()
        shell: bash
        run: |
          if [[ -n "${BACKUP_DIR:-}" && -d "${BACKUP_DIR}" ]]; then
            rm -rf -- "${BACKUP_DIR}"
          fi
